<!doctype html><html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><title>Display connection</title><style>body{background:#102d29;color:#eaf6ef;font:16px Arial;text-align:center;padding:45px 25px}h1{font-size:25px}#code{font-size:48px;letter-spacing:9px;margin:35px 0;color:#80eeb7}p{line-height:1.7;color:#bbcec3}button{padding:12px 20px;border:0;border-radius:8px;background:#79e7ad;color:#123d2b;cursor:pointer}footer{margin-top:30px;font-size:12px;color:#9cbbab}.error{color:#ffb7ad}</style><h1>Connect this display</h1><p>In Admin, open Display → Computers.<br>Enter this nine-digit code and give this computer a name.</p><div id="code">Connecting…</div><button id="rotate">Change code</button><p id="status"></p><footer>Powered by YKonnect</footer><script>const code=document.getElementById('code'),status=document.getElementById('status'),button=document.getElementById('rotate');function show(s){status.className=s.error?'error':'';if(s.error){status.textContent=s.error;return;}if(s.code)code.textContent=s.code;button.hidden=false;status.textContent=s.paired?(s.label+' · waiting for Admin to turn on the display.'):'This code stays the same until you choose Change code.';}window.ykDevice.onPair(show);window.ykDevice.pair().then(show).catch(e=>show({error:e.message}));button.onclick=()=>window.ykDevice.rotate().then(show).catch(e=>show({error:e.message}));</script></html>
