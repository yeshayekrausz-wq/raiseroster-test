<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hatzlacha Display</title><style>
*{box-sizing:border-box}body{margin:0;background:#102739;color:white;font-family:Arial,sans-serif}#screen{height:100vh;overflow:auto;display:grid;place-items:center;padding:4vh 4vw;text-align:center}h1{font-size:clamp(32px,5vw,80px);margin:10px}p{font-size:clamp(20px,3vw,48px)}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;max-width:1400px;width:90vw}.score{background:#ffffff16;border:1px solid #ffffff33;padding:20px;border-radius:18px;font-size:24px}.score b{display:block;font-size:40px;color:#9aefd6}.media{width:100%;height:90vh;object-fit:contain}.background{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.shade{position:fixed;inset:0;background:#081827a8;z-index:-1}#controls{position:fixed;top:8px;left:8px;z-index:5;opacity:.3}#controls:hover,#controls:focus-within{opacity:1}button,a{font:inherit;padding:8px;border-radius:8px;background:white;color:#153f50;border:0}#status{position:fixed;bottom:8px;left:8px;font-size:12px;background:#102739dd;padding:5px}a{display:inline-block;text-decoration:none}
</style></head><body><div id="controls"><button id="fullscreen">Full screen</button> <a id="back" href="../admin/#display">Settings</a></div><main id="screen"><h1>Connecting…</h1></main><div id="status" role="status"></div><script type="module" src="./display.js"></script></body></html>
