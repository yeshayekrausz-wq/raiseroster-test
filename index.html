<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#244f86">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="./install.js" defer></script>
<title>YKonnect</title>
  <link rel="icon" type="image/png" href="favicon2.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#17304f;font-family:Arial,sans-serif}
main{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #dce6f1;border-radius:20px;padding:34px;box-shadow:0 18px 50px rgba(28,55,91,.12);text-align:center}
h1{margin:0 0 8px;font-size:34px} p{color:#6a7c92;margin:0 0 26px}
nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a{display:block;padding:15px 12px;border-radius:12px;text-decoration:none;font-weight:800;background:#244f86;color:#fff}
a:last-child{background:#e8b84c;color:#17304f}
small{display:block;margin-top:24px;color:#8a98aa}
@media(max-width:480px){nav{grid-template-columns:1fr}}

.install{margin-top:26px;padding-top:22px;border-top:1px solid #dce6f1}
.install h2{font-size:18px;margin:0 0 14px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;padding:12px 8px;border:1px solid #cad8e8;border-radius:10px;background:#f4f7fb;color:#17304f}button:hover{background:#e5edf8}button:focus-visible{outline:3px solid #e8b84c;outline-offset:2px}
.install p{font-size:13px;line-height:1.6;margin:14px 0 0}.status:empty{display:none}.status{font-size:13px;line-height:1.5;margin-top:15px;color:#526780}
dialog{border:1px solid #dce6f1;border-radius:16px;padding:24px;max-width:420px;width:calc(100% - 32px);color:#17304f}dialog::backdrop{background:#17304f88}dialog p{line-height:1.7;margin:14px 0}dialog button{width:100%}
.install-badge{display:flex;align-items:center;gap:12px;text-align:left;background:#090909;color:#fff;border:1px solid #777;border-radius:9px;min-height:66px;padding:10px 14px}.install-badge:hover{background:#242424}.install-badge svg{width:30px;height:34px;flex-shrink:0;fill:currentColor}.badge-caption{display:block;font-size:10px;letter-spacing:1px;line-height:1.5}.badge-name{display:block;font-size:20px;font-weight:600;line-height:1.25}.install-badge[data-platform="ios"] .badge-name{font-size:17px}@media(max-width:400px){.buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>YKonnect</h1>
<p>Campaign Dashboard</p>
<nav>
<a href="./admin/">Admin</a>
<a href="./projector/">Projector</a>
</nav>
<section class="install" aria-labelledby="install-title">
<h2 id="install-title">Install YKonnect</h2>
<div class="buttons">
<button class="install-badge" type="button" data-platform="windows" aria-label="Install for Windows"><svg viewBox="0 0 26 28" aria-hidden="true" focusable="false"><path d="M2 4l9-1v9H2zm11-1.2L23 1v11H13zM2 14h9v9l-9-1zm11 0h10v11l-10-1.8z"/></svg><span><span class="badge-caption">INSTALL FOR</span><span class="badge-name">Windows</span></span></button>
<button class="install-badge" type="button" data-platform="android" aria-label="Install for Android"><svg viewBox="0 0 26 28" aria-hidden="true" focusable="false"><path d="M5 9a7 7 0 0114 0v1H5zm0 3h14v9a2 2 0 01-2 2H7a2 2 0 01-2-2z"/><path d="M7 3L5 0m12 3l2-3M2 12v9m20-9v9M8 23v3m8-3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="1" fill="#090909"/><circle cx="15" cy="7" r="1" fill="#090909"/></svg><span><span class="badge-caption">INSTALL FOR</span><span class="badge-name">Android</span></span></button>
<button class="install-badge" type="button" data-platform="ios" aria-label="Install for iPhone / iPad"><svg viewBox="0 0 26 28" aria-hidden="true" focusable="false"><path d="M16.7 0c.2 2-1.4 4.2-3.5 4.4-.3-2 1.6-4.1 3.5-4.4zM20.7 18.4c-.8 1.8-2 4-3.9 4-1.2 0-1.8-.8-3.4-.8s-2.3.8-3.5.8C6.6 22.4 3 15.7 3 11.5c0-3.9 2.5-6.1 5.1-6.1 1.4 0 2.8.9 3.7.9 1 0 2.7-1.1 4.5-.9 1.7.1 3 1 3.9 2.2-3.5 2-3 7.2.5 8.6z"/></svg><span><span class="badge-caption">INSTALL FOR</span><span class="badge-name">iPhone / iPad</span></span></button>
<button class="install-badge" type="button" data-platform="mac" aria-label="Install for Mac"><svg viewBox="0 0 26 28" aria-hidden="true" focusable="false"><rect x="2" y="2" width="20" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 18h6v4h4v2H5v-2h4z"/></svg><span><span class="badge-caption">INSTALL FOR</span><span class="badge-name">Mac</span></span></button>
</div>
</section>
<div class="status" id="update" role="status"></div>
<dialog id="install-help" aria-labelledby="help-title"><h2 id="help-title">Install YKonnect</h2><p id="help-text"></p><form method="dialog"><button>Close</button></form></dialog>
<small>Powered by YKonnect</small>
</main>
</body>
</html>
