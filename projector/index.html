<!doctype html>
<!-- RaiseRoster Projector - Step 20 (Live Control connected)
     Adds honoring of Admin > Projector > Live Control (migration 0002's
     live_control_state): Freeze pauses name rotation and data refresh display,
     Test Mode shows a TEST ribbon, Spotlight shows the chosen student full-screen.
     Feature-detects: without 0002 the projector behaves exactly like Step 19.
     Everything else byte-identical to Step 19.
     (Step 19 (Phase 1 minimal fixes; full consolidation comes in Phase 2)
     Changes vs Step 18: the device controls (Sign Out, Show Last Update) were being
     permanently hidden by a Step-12 patch rule — they are visible again outside
     fullscreen/embed, exactly as originally designed; the projector now shows an
     honest offline banner after repeated failed refreshes instead of silently
     presenting stale numbers as live (spec §55). Nothing else touched. -->
<html lang="yi" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RaiseRoster Projector</title>
     <link rel="icon" type="image/png" href="../favicon2.png">
     <link rel="manifest" href="../manifest.webmanifest">
     <meta name="theme-color" content="#17304f">
     <meta name="application-name" content="RaiseRoster Projector">
     <meta name="apple-mobile-web-app-capable" content="yes">
     <meta name="apple-mobile-web-app-title" content="RaiseRoster Projector">

  <style>
    :root{
      --bg1:#dce8f5;
      --bg2:#8fa9c5;
      --bg3:#5f7fa6;
      --ink:#ffffff;
      --muted:#dce7f2;
      --gold:#ffd54a;
      --card:rgba(35,72,120,.90);
      --card2:rgba(49,92,145,.92);
      --stroke:rgba(255,255,255,.30);
      --fill1:#fff176;
      --fill2:#ffb74d;
      --fill3:#ff7043;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; overflow:hidden;
      font-family: "Noto Sans Hebrew","Noto Sans","Segoe UI","Arial Unicode MS",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 500px at 50% 4%, rgba(255,255,255,.42), transparent 62%),
        radial-gradient(760px 480px at 8% 92%, rgba(255,213,74,.16), transparent 60%),
        radial-gradient(760px 480px at 92% 88%, rgba(255,255,255,.15), transparent 60%),
        linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%);
    }
    .bgimg{
      position:fixed; inset:0;
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:.16;
      filter: saturate(1.05) contrast(1.05);
      pointer-events:none;
    }
    .overlay{
      position:fixed; inset:0;
      background:
        radial-gradient(900px 460px at 50% 0%, rgba(255,255,255,.12), transparent 68%),
        linear-gradient(180deg, rgba(16,42,76,.06), rgba(16,42,76,.20));
      pointer-events:none;
    }

    .wrap{
      height:100vh;
      display:grid;
      grid-template-rows: auto 1fr;
      padding: clamp(10px,1.2vw,22px) clamp(12px,1.6vw,28px) clamp(8px,1vw,16px);
      gap: clamp(8px,.9vw,14px);
    }

    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:14px;
      padding: clamp(9px,.9vw,15px) clamp(12px,1.2vw,20px);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(24,58,100,.88), rgba(45,88,140,.88));
      border: 1px solid rgba(255,255,255,.26);
      box-shadow: 0 12px 34px rgba(15,42,76,.24), inset 0 1px 0 rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
    }
    .title{
      font-weight: 950;
      font-size: clamp(30px, 3.8vw, 62px);
      text-shadow: 0 10px 30px rgba(0,0,0,.45);
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 70vw;
    }
    .meta{
      direction:ltr; text-align:left;
      font-weight: 950;
      font-size: clamp(23px, 2.8vw, 46px);
      color: var(--gold);
      text-shadow: 0 10px 30px rgba(0,0,0,.45);
      white-space:nowrap;
    }
    .meta .small{
      display:block;
      margin-top:6px;
      font-size: clamp(14px, 1.35vw, 20px);
      color: rgba(255,255,255,.78);
      font-weight: 850;
    }

    .stage{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
    }

    .card{
      background:
        linear-gradient(155deg, rgba(255,255,255,.11), rgba(255,255,255,.025)),
        linear-gradient(145deg, var(--card2), var(--card));
      border: 1px solid var(--stroke);
      border-radius: 22px;
      box-shadow: 0 14px 32px rgba(14,42,77,.28),
        inset 0 1px 0 rgba(255,255,255,.16),
        0 0 0 1px rgba(255,213,74,.05);
      backdrop-filter: blur(8px);
      overflow:hidden;
    }

    /* CLASSIC 4 columns */
    .classic{
      width:100%;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px,.9vw,15px);
      align-content:center;
      padding:0;
      grid-auto-rows:minmax(0,1fr);
      max-height:calc(100vh - clamp(110px,15vh,175px));
    }

    /* MENORAH */
    .menorah{
      width:min(1400px, 98vw);
      height:min(690px, 65vh);
      display:grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 16px;
      align-items:end;
      position:relative;
    }
    .side{
      display:grid;
      grid-template-rows: repeat(4, 1fr);
      gap: 14px;
      padding-bottom: 12px;
    }
    .center{
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding-bottom: 10px;
      align-items:center;
    }
    .shamash{
      width:100%;
      max-width: 680px;
      padding: 24px 24px 22px;
      border-radius: 26px;
      border: 2px solid rgba(255,223,122,.35);
      transform: scale(1.06);
    }
    .silverBase{
      position:absolute;
      left:50%; transform:translateX(-50%);
      bottom:-6px;
      width:min(1100px, 94vw);
      height: 84px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(154,163,181,.65), rgba(207,211,221,.65), rgba(246,247,251,.65), rgba(207,211,221,.65), rgba(154,163,181,.65));
      box-shadow: 0 26px 70px rgba(0,0,0,.45), inset 0 3px 10px rgba(255,255,255,.22);
      opacity:.55;
      pointer-events:none;
    }
    .silverStem{
      position:absolute;
      left:50%; transform:translateX(-50%);
      bottom: 52px;
      width: 18px; height: 190px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(246,247,251,.65), rgba(207,211,221,.65), rgba(154,163,181,.65));
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      opacity:.55;
      pointer-events:none;
    }

    /* TEAM CARD */
    .teamCard{
      padding: clamp(12px,1.1vw,18px);
      min-height:0;
      height:100%;
      position:relative;
    }
    .rowTop{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .tName{
      font-weight: 1000;
      font-size: clamp(20px, 1.9vw, 30px);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width: 62%;
    }
    .tPct{
      direction:ltr;
      font-weight: 1000;
      font-size: clamp(20px, 1.9vw, 30px);
      color: var(--gold);
      white-space:nowrap;
    }
    .tRaisedBig{
      margin-top: 10px;
      direction:ltr;
      text-align:left;
      font-weight: 1000;
      font-size: clamp(30px, 3.15vw, 54px);
      color: rgba(255,255,255,.96);
      text-shadow: 0 14px 36px rgba(0,0,0,.50);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tGoalSmall{
      margin-top: 4px;
      direction:ltr;
      text-align:left;
      color: rgba(255,255,255,.72);
      font-weight: 850;
      font-size: clamp(13px, 1.2vw, 18px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meter{
      margin-top:12px;
      height: clamp(15px,1.3vw,21px);
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      overflow:hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }
    .fill{
      height:100%;
      width:0%;
      border-radius:999px;
      background: linear-gradient(90deg, var(--fill1), var(--fill2), var(--fill3));
      box-shadow: 0 0 24px rgba(255,184,77,.35);
      transition: width 700ms ease;
    }

    /* Individuals line */
    .indLine{
      margin-top: clamp(6px,.7vw,10px);
      padding: clamp(6px,.6vw,10px) clamp(8px,.7vw,12px);
      border-top: 1px solid rgba(255,255,255,0.16);
      border-radius:12px;
      background:rgba(255,255,255,.075);
      display:none;
      align-items:baseline;
      justify-content:space-between;
      gap: 10px;
    }
    .indName{
      font-weight: 950;
      font-size: clamp(17px, 1.6vw, 24px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 72%;
    }
    .indAmt{
      direction:ltr;
      color: var(--gold);
      font-weight: 950;
      font-size: clamp(17px, 1.6vw, 24px);
      white-space:nowrap;
    }

    .hidden{ display:none !important; }

    @media (max-width:1200px){
      .classic{gap:8px;}
      .teamCard{padding:10px 11px;}
      .tName,.tPct{font-size:clamp(17px,1.7vw,24px);}
      .tRaisedBig{font-size:clamp(25px,2.8vw,42px);}
      .indName,.indAmt{font-size:clamp(15px,1.45vw,20px);}
    }

    @media (max-height:760px){
      .wrap{padding-top:8px;padding-bottom:7px;gap:7px;}
      .topbar{padding:7px 12px;border-radius:16px;}
      .title{font-size:clamp(25px,3.1vw,44px);}
      .meta{font-size:clamp(19px,2.2vw,32px);}
      .meta .small{margin-top:2px;font-size:clamp(11px,1vw,15px);}
      .teamCard{padding:9px 11px;}
      .tRaisedBig{margin-top:5px;}
      .meter{margin-top:6px;}
      .indLine{margin-top:5px;padding:5px 8px;}
    }

    @media (max-height:620px){
      .tGoalSmall{display:none;}
      .teamCard{padding:8px 9px;}
      .meter{height:12px;margin-top:4px;}
      .indLine{margin-top:4px;padding:4px 7px;}
    }
  </style>

<style>

<style>
/* Step 9: allow long student names to wrap cleanly onto two lines */
.student-name,
.name,
.person-name,
.card .name,
.classic .name{
  white-space:normal !important;
  overflow:visible !important;
  text-overflow:clip !important;
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.08;
  max-height:2.25em;
  min-height:2.15em;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

/* Leave enough vertical room in each student card for a second name line */
.student-card,
.person-card,
.card{
  min-height:clamp(92px,11vh,132px);
  box-sizing:border-box;
}

}

    max-height:2.2em;
  }
}
</style>

<style>
/* Step 11: dynamic class grid — show every active class and keep the layout balanced */
.classic{
  grid-template-columns:repeat(var(--grid-cols,4),minmax(0,1fr)) !important;
  grid-template-rows:repeat(var(--grid-rows,2),minmax(0,1fr)) !important;

<style>
/* Step 12: requested projector-only refinements */

   embed modes still hide the controls via their own rules below. */

#spotlightCard .spAmount{font-size:min(6vw,54px);font-weight:900;color:#0b7a53;margin-top:12px}
#spotlightCard .spTag{font-size:20px;color:#65748d;margin-top:14px;letter-spacing:1px}
#blackoutScreen{position:fixed;inset:0;background:#000;z-index:30000;display:none;pointer-events:none}
body.projector-blackout #blackoutScreen{display:block}
#fullscreenBtn{z-index:31010!important}
#projectorControls{z-index:31020!important}
body.projector-blackout #fullscreenBtn{display:flex!important;opacity:.62!important}
body.projector-blackout:not(.fullscreen-active) #projectorControls{display:flex!important}
body.projector-blackout.fullscreen-active #projectorControls{display:none!important}
body.projector-blackout.fullscreen-active #fullscreenBtn{display:flex!important;opacity:.20!important}

    .bgvideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:var(--background-opacity,.16)}

function minutesOf(t){const [h,m]=String(t||'').split(':').map(Number);return Number.isFinite(h)&&Number.isFinite(m)?h*60+m:null}
function latestScheduledState(now=new Date()){
  if(!projectorSettings.projector_schedule_enabled)return null;
  const sched=projectorSettings.projector_schedule||{};let active=false,hasRange=false;
  const mins=now.getHours()*60+now.getMinutes(),today=now.getDay();
  const inRange=(a,b)=>{const A=minutesOf(a),B=minutesOf(b);if(A==null||B==null)return false;return A<=B?(mins>=A&&mins<B):(mins>=A||mins<B)};
  for(const x of sched.weekly||[]){if(x.enabled===false)continue;if(x.start&&x.end){hasRange=true;const ds=(x.days||[]).map(Number);if(ds.includes(today)&&inRange(x.start,x.end))active=true}}
  const iso=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  for(const x of sched.dates||[]){if(x.enabled===false)continue;if(x.date===iso&&x.start&&x.end){hasRange=true;if(inRange(x.start,x.end))active=true}}
  if(hasRange)return active?'on':'off';
  // Legacy event schedules remain supported.
  const events=[];for(const x of sched.dates||[]){if(x.enabled===false||!x.date||!x.time)continue;const dt=new Date(`${x.date}T${x.time}:00`);if(dt<=now)events.push({dt,state:x.state||'off'})}
  for(const x of sched.weekly||[]){if(x.enabled===false||!x.time)continue;const days=Array.isArray(x.days)?x.days:(x.day!=null?[Number(x.day)]:[]);const [hh,mm]=x.time.split(':').map(Number);for(const d of days){const dt=new Date(now);const back=(now.getDay()-Number(d)+7)%7;dt.setDate(now.getDate()-back);dt.setHours(hh,mm,0,0);if(dt>now)dt.setDate(dt.getDate()-7);events.push({dt,state:x.state||'off'})}}

function makePreviewEditOverlay(selector,label,kind){if(!PREVIEW_MODE)return;const el=document.createElement('div');el.className='previewEditBox';el.innerHTML=`<span>${label}</span><i title="Resize"></i>`;document.body.appendChild(el);const obj={selector,el,kind};previewEditBoxes.push(obj);let mode='',sx=0,sy=0,start={};const begin=(e,m)=>{e.preventDefault();e.stopPropagation();mode=m;sx=e.clientX;sy=e.clientY;const l={classCardScale:1,classCardOffsetX:0,classCardOffsetY:0,totalScale:1,totalOffsetX:0,totalOffsetY:0,...(projectorSettings.projector_layout||{})};start={...l};el.setPointerCapture?.(e.pointerId)};el.addEventListener('pointerdown',e=>{if(e.target.tagName==='I')return;begin(e,'move')});el.querySelector('i').addEventListener('pointerdown',e=>begin(e,'resize'));el.addEventListener('pointermove',e=>{if(!mode)return;const dx=e.clientX-sx,dy=e.clientY-sy,l={...start};if(kind==='class'){if(mode==='move'){l.classCardOffsetX=start.classCardOffsetX+dx;l.classCardOffsetY=start.classCardOffsetY+dy}else l.classCardScale=Math.max(.6,Math.min(1.45,start.classCardScale+dx/500))}else{if(mode==='move'){l.totalOffsetX=start.totalOffsetX+dx;l.totalOffsetY=start.totalOffsetY+dy}else l.totalScale=Math.max(.65,Math.min(1.4,start.totalScale+dx/500))}projectorSettings.projector_layout=l;applyProjectorAppearance();parent.postMessage({type:'rr-preview-layout',layout:l},'*')});el.addEventListener('pointerup',()=>{mode=''})}
window.addEventListener('message',e=>{const d=e.data;if(!PREVIEW_MODE||!d||d.type!=='rr-projector-preview')return;projectorSettings={...projectorSettings,...(d.settings||{}),projector_layout:{...(projectorSettings.projector_layout||{}),...((d.settings||{}).projector_layout||{})}};applyProjectorAppearance();applyBlackout()});
window.addEventListener('resize',updatePreviewEditOverlays);
setTimeout(()=>{if(PREVIEW_MODE){makePreviewEditOverlay('.classic','Classes','class');makePreviewEditOverlay('.topbar','Total / Header','total');updatePreviewEditOverlays()}},1200);

function teamPct(t){return Number(t.goal||0)>0?clamp01(Number(t.raised||0)/Number(t.goal||0)):0}

function buildTeamCard(){
  const el=document.createElement("div");
  el.className="card teamCard";
  el.innerHTML=`
    <div class="rowTop"><div class="tName" data-name>—</div><div class="tPct" data-pct>0%</div></div>
    <div class="tRaisedBig" data-raised>$0</div>
    <div class="tGoalSmall" data-goal></div>
    <div class="meter"><div class="fill" data-fill style="width:0%"></div></div>
    <div class="indLine" data-indline><div class="indName" data-indname></div><div class="indAmt" data-indamt></div></div>`;
  return el;
}

function applyCard(card,team,playIndividuals,goalMode){
  card.style.visibility=team?"visible":"hidden";
  if(!team)return;
  card.dataset.teamId=team.id||"";
  card.querySelector("[data-name]").textContent=team.name||"—";
  const p=teamPct(team);
  card.querySelector("[data-pct]").textContent=pctText(p);
  card.querySelector("[data-raised]").textContent=money(team.raised);
  card.querySelector("[data-goal]").textContent=`ציל: ${money(team.goal)}`;
  card.querySelector("[data-fill]").style.width=Math.round(p*100)+"%";
  const indLine=card.querySelector("[data-indline]");
  indLine.style.display=playIndividuals?"flex":"none";
}

function rankTeams(teams){
  return [...teams].sort((a,b)=>Number(b.raised||0)-Number(a.raised||0)||String(a.name).localeCompare(String(b.name),"he"));
}

function hebrewYearToLetters(year){
  let rem=Number(year)%1000,out="";
  for(const [v,ch] of [[400,"ת"],[300,"ש"],[200,"ר"],[100,"ק"],[90,"צ"],[80,"פ"],[70,"ע"],[60,"ס"],[50,"נ"],[40,"מ"],[30,"ל"],[20,"כ"],[10,"י"],[9,"ט"],[8,"ח"],[7,"ז"],[6,"ו"],[5,"ה"],[4,"ד"],[3,"ג"],[2,"ב"],[1,"א"]]){
    while(rem>=v){out+=ch;rem-=v}
  }
  return out.length>=2?out.slice(0,-1)+'"'+out.slice(-1):out+"'";
}
function hebrewDayToLetter(day){
  return ({1:"א",2:"ב",3:"ג",4:"ד",5:"ה",6:"ו",7:"ז",8:"ח",9:"ט",10:"י",11:"יא",12:"יב",13:"יג",14:"יד",15:"טו",16:"טז",17:"יז",18:"יח",19:"יט",20:"כ",21:"כא",22:"כב",23:"כג",24:"כד",25:"כה",26:"כו",27:"כז",28:"כח",29:"כט",30:"ל"})[Number(day)]||day;
}
function hebrewDateString(date){
  try{
    const parts=new Intl.DateTimeFormat("he-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).formatToParts(date);
    const get=t=>parts.find(p=>p.type===t)?.value;
    return `${hebrewDayToLetter(get("day"))} ${get("month")} ${hebrewYearToLetters(get("year"))}`;
  }catch{return date.toLocaleDateString("en-US")}
}
function timeString(date){
  return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",hour12:true}).format(date);
}


let lastHash="";
const perClassQueues=new Map(),perClassIdx=new Map();
function rebuildQueuesIfNeeded(d){
  const hash=JSON.stringify((d.teams||[]).map(t=>[t.id,t.individuals]));
  if(hash===lastHash)return;
  lastHash=hash;perClassQueues.clear();perClassIdx.clear();
  for(const t of d.teams||[]){
    const list=(t.individuals||[]).filter(x=>x.name).sort((a,b)=>b.amount-a.amount||a.name.localeCompare(b.name,"he"));
    perClassQueues.set(t.id,list);perClassIdx.set(t.id,0);
  }
}
function tickPerClassNames(){
  if(!liveData.playIndividuals)return;
  rebuildQueuesIfNeeded(liveData);
  document.querySelectorAll(".teamCard").forEach(card=>{
    const list=perClassQueues.get(card.dataset.teamId)||[];
    const n=card.querySelector("[data-indname]"),a=card.querySelector("[data-indamt]");
    if(!n||!a)return;
    if(!list.length){n.textContent="";a.textContent="";return}
    const idx=perClassIdx.get(card.dataset.teamId)||0,x=list[idx%list.length];
    perClassIdx.set(card.dataset.teamId,idx+1);
    n.textContent=x.name;a.textContent=money(x.amount);
  });
}

async function loadLiveData(){
  const badge=document.getElementById("connectionBadge");
  
  try{
    await resolveProjectorOrg();
    

    const {data:campaigns,error:cErr}=await supabase.from("campaigns")
      .select("id,name,goal_mode,overall_goal,show_zero_students,show_previous_history")
      .eq("is_active",true).limit(1);
    if(cErr)throw cErr;
    const campaign=campaigns?.[0];
    if(!campaign)throw new Error("No active campaign");

    const [
      {data:classes,error:clErr},
      {data:assignments,error:aErr},
      {data:students,error:sErr},
      {data:contrib,error:coErr},
      {data:goals,error:gErr}
    ]=await Promise.all([
      supabase.from("classes").select("id,name,sort_order").eq("is_active",true).order("sort_order"),
      supabase.from("student_class_assignments").select("student_id,class_id").eq("is_current",true),
      supabase.from("students").select("id,name").eq("is_archived",false),
      supabase.from("contributions").select("student_id,amount").eq("campaign_id",campaign.id),
      supabase.from("campaign_class_goals").select("class_id,goal").eq("campaign_id",campaign.id)
    ]);
    if(clErr)throw clErr;if(aErr)throw aErr;if(sErr)throw sErr;if(coErr)throw coErr;if(gErr)throw gErr;

    const studentMap=new Map((students||[]).map(s=>[s.id,s]));
    const assignmentMap=new Map((assignments||[]).map(a=>[a.student_id,a.class_id]));
    const goalMap=new Map((goals||[]).map(g=>[g.class_id,Number(g.goal||0)]));
    const studentTotals=new Map();
    for(const x of contrib||[]) studentTotals.set(x.student_id,(studentTotals.get(x.student_id)||0)+Number(x.amount||0));

    const teams=(classes||[]).map(c=>{
      const individuals=[];
      for(const [studentId,classId] of assignmentMap){
        if(classId!==c.id)continue;
        const st=studentMap.get(studentId);if(!st)continue;
        const amount=studentTotals.get(studentId)||0;
        if(campaign.show_zero_students||amount>0)individuals.push({name:st.name,amount});
      }
      return {
        id:c.id,name:c.name,goal:goalMap.get(c.id)||0,
        raised:individuals.reduce((s,x)=>s+x.amount,0),
        individuals
      };
    });

    // Class total must include hidden zero students too; zero doesn't affect total.
    const nextData={
      campaignName:campaign.name||"קאמפיין",
      goalMode:!!campaign.goal_mode,
      playIndividuals:true,
      displayMode:"classic",
      teams
    };
    const fingerprint=JSON.stringify(nextData);
    if(!lastDataFingerprint){
      // First load is only the baseline. Opening/refreshing the projector is NOT an update.
      lastDataFingerprint=fingerprint;
    }else if(fingerprint!==lastDataFingerprint){
      // Only a real data/settings change advances Last Update.
      lastDataFingerprint=fingerprint;
      lastRealUpdateAt=Date.now();
    }
    liveData={...nextData,updatedAt:lastRealUpdateAt};
    liveLoadFailures=0;showConnectionBadge("");
    render();
  }catch(e){
    console.error(e);
    liveLoadFailures++;
    if(liveLoadFailures>=2)showConnectionBadge("אָפֿליין — ווייזט לעצטע באַקאַנטע צאָלן");
  }
}

function render(){
  const d=liveData;
  document.body.classList.toggle("noGoals",!d.goalMode);
  document.getElementById("campaignTitle").textContent=safeStr(d.campaignName||"קאמפיין");

  const teams=(d.teams||[]).map(t=>({...t,goal:Number(t.goal||0),raised:Number(t.raised||0)}));
  const totalGoal=teams.reduce((a,t)=>a+t.goal,0),totalRaised=teams.reduce((a,t)=>a+t.raised,0);
  const totalsEl=document.getElementById("totals");
  totalsEl.firstChild.textContent=d.goalMode?`${money(totalRaised)} / ${money(totalGoal)}`:money(totalRaised);
  const upd=document.getElementById("updated");
  if(upd){
    const show=document.getElementById("showLastUpdateToggle")?.checked!==false;
    upd.style.display=show?"":"none";
    if(show){
      if(d.updatedAt){
        const dt=new Date(d.updatedAt);
        upd.innerHTML=`לעצט אפדעיט: ${hebrewDateString(dt)} <span dir="ltr" style="unicode-bidi:isolate">${timeString(dt)}</span>`;
      }else{
        upd.textContent="";
      }
    }
  }

  const ranked=rankTeams(teams);
  const classic=document.getElementById("classicGrid"),menorah=document.getElementById("menorahGrid");
  classic.classList.remove("hidden");menorah.classList.add("hidden");

  const count=Math.max(1,ranked.length);
  let cols;
  if(count===1) cols=1;
  else if(count===2) cols=2;
  else if(count===3) cols=3;
  else if(count===4) cols=2;
  else if(count<=6) cols=3;
  else if(count<=8) cols=4;
  else if(count===9) cols=3;
  else if(count<=12) cols=4;
  else if(count<=15) cols=5;
  else if(count===16) cols=4;
  else cols=Math.ceil(Math.sqrt(count*1.45));

  const rows=Math.ceil(count/cols);
  classic.style.setProperty("--grid-cols",String(cols));
  classic.style.setProperty("--grid-rows",String(rows));
  classic.dataset.rows=String(rows);

  if(classic.childElementCount!==ranked.length){
    classic.innerHTML="";
    for(let i=0;i<ranked.length;i++) classic.appendChild(buildTeamCard());
  }
  [...classic.children].forEach((c,i)=>applyCard(c,ranked[i],d.playIndividuals,d.goalMode));
  rebuildQueuesIfNeeded(d);
}


const loginBox=document.getElementById("projectorLogin");
const loginBtn=document.getElementById("projectorLoginBtn");
const loginEmail=document.getElementById("projectorEmail");
const loginPassword=document.getElementById("projectorPassword");
const loginError=document.getElementById("loginError");
const signOutBtn=document.getElementById("signOutBtn");
const showLastUpdateToggle=document.getElementById("showLastUpdateToggle");

showLastUpdateToggle.checked=localStorage.getItem("projector_show_last_update")!=="false";
showLastUpdateToggle.addEventListener("change",()=>{
  localStorage.setItem("projector_show_last_update",String(showLastUpdateToggle.checked));
  render();
});

async function handleLogin(){
  loginError.textContent="";
  const email=loginEmail.value.trim(), password=loginPassword.value;
  if(!email||!password){loginError.textContent="Enter email and password.";return}
  loginBtn.disabled=true;
  const {error}=await supabase.auth.signInWithPassword({email,password});
  loginBtn.disabled=false;
  if(error){loginError.textContent=error.message;return}
  loginBox.style.display="none";
  await loadLiveData();
}
loginBtn.addEventListener("click",handleLogin);
loginPassword.addEventListener("keydown",e=>{if(e.key==="Enter")handleLogin()});
loginEmail.addEventListener("keydown",e=>{if(e.key==="Enter")loginPassword.focus()});

signOutBtn.addEventListener("click",async()=>{
  await supabase.auth.signOut();
  if(viaHub){location.href="../";return;}
  loginPassword.value="";
  loginBox.style.display="flex";
});

window.addEventListener('message',async e=>{
  if(e.origin!==location.origin)return;const d=e.data;if(!d||d.type!=='rr-auth-session'||!d.access_token||!d.refresh_token)return;
  const {error}=await supabase.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});
  if(!error){loginBox.style.display='none';await loadProjectorSettings();await loadLiveData()}
});

const fullscreenBtn=document.getElementById("fullscreenBtn");
async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){ console.error(e); }
}
fullscreenBtn.addEventListener("click",toggleFullscreen);
document.addEventListener("fullscreenchange",()=>{
  const on=!!document.fullscreenElement;
  document.body.classList.toggle("fullscreen-active",on);
  fullscreenBtn.textContent=on?"×":"⛶";
  fullscreenBtn.title=on?"Exit full screen":"Full screen";
});

},10000);

// PWA install button. Chrome/Edge only expose the install prompt after
// beforeinstallprompt fires. When already installed, the button stays hidden.
let deferredInstallPrompt=null;
const installAppBtn=document.getElementById("installAppBtn");
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if(installAppBtn)installAppBtn.style.display="inline-flex";
});
installAppBtn?.addEventListener("click",async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice.catch(()=>null);
  deferredInstallPrompt=null;
  installAppBtn.style.display="none";
});
window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  if(installAppBtn)installAppBtn.style.display="none";
});

// Installable browser app (PWA). The service worker caches only the app shell;
// live campaign data continues to come from Supabase.
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.getRegistrations().then(async regs=>{
    const legacyScope=new URL('./',location.href).href;
    for(const reg of regs){if(reg.scope===legacyScope) await reg.unregister();}
    return navigator.serviceWorker.register('../sw.js',{updateViaCache:'none'});
  }).catch(console.warn));
}
